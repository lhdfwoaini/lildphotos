<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10100f" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>页面没有找到｜在路上 · LilD Photos</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10100f;
        --text: #eeeae2;
        --secondary: #aaa69e;
        --line: rgba(238, 234, 226, 0.16);
        --accent: #ad9270;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        display: grid;
        place-items: center;
        color: var(--text);
        background: var(--bg);
        font-family: Inter, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      main {
        width: min(calc(100% - 40px), 760px);
        padding: clamp(34px, 8vw, 76px);
        border: 1px solid var(--line);
      }

      .kicker {
        margin: 0 0 20px;
        color: var(--accent);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 8vw, 5rem);
        font-weight: 500;
        line-height: 1.08;
      }

      p {
        margin: 22px 0 0;
        color: var(--secondary);
        line-height: 1.8;
      }

      nav {
        margin-top: 42px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        min-height: 46px;
        padding: 11px 16px;
        display: inline-flex;
        align-items: center;
        color: var(--text);
        border: 1px solid var(--line);
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: var(--accent);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404 / 在路上 · LILD PHOTOS</p>
      <h1>页面没有找到</h1>
      <p>这个地址没有对应的页面。你可以回到首页，或直接继续浏览精选栏目。</p>
      <nav aria-label="错误页面导航">
        <a href="index.html#home">← 返回首页</a>
        <a href="index.html#works">返回精选栏目 →</a>
      </nav>
    </main>
  </body>
</html>
